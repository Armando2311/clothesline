name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  macos:
    name: App build + tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build (debug, all targets)
        run: |
          set +e
          swift build --build-tests 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "---- unique errors ----"
          grep -E "error:" build.log | sort -u | head -n 100
          exit $status
      - name: Core unit tests
        run: swift test --skip-build
      - name: Build app bundle (universal, release)
        run: Scripts/build-app.sh --universal
      - name: Verify bundle
        run: |
          plutil -lint build/Clothesline.app/Contents/Info.plist
          lipo -info build/Clothesline.app/Contents/MacOS/Clothesline
          codesign --verify --deep --strict --verbose=2 build/Clothesline.app
      - name: Launch smoke test
        run: Scripts/smoke-test.sh build/Clothesline.app
      - name: XcodeGen project builds
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Clothesline.xcodeproj -scheme Clothesline -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build | tail -n 30
      - uses: actions/upload-artifact@v4
        with:
          name: Clothesline.app
          path: build/Clothesline.zip
